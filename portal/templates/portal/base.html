{% load static %}<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Dehlsen Energy{% endblock %}</title>
<link rel="manifest" href="{% url 'manifest' %}">
<meta name="theme-color" content="#3B73B9">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dehlsen">
<link rel="icon" type="image/png" sizes="192x192" href="{% static 'portal/icon-192.png' %}">
<link rel="apple-touch-icon" href="{% static 'portal/apple-touch-icon.png' %}">
<style>
:root{--blue:#3B73B9;--orange:#E8730C;--green:#2e9e5b;--purple:#7b4fd1;--red:#d64545;--bg:#f4f7fb;--card:#fff;--ink:#1d2733;--mut:#6b7788;--line:#e3e9f1}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink)}
.app{max-width:1000px;margin:0 auto;padding:16px}
.top{background:var(--blue);color:#fff;border-radius:14px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:10px}
.top h1{font-size:18px;margin:0}.top small{opacity:.85}
.top form{margin:0}.pill{background:rgba(255,255,255,.18);color:#fff;border:0;border-radius:999px;padding:6px 13px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none;display:inline-block}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 2px 10px rgba(30,50,80,.06);margin-bottom:14px}
.btn{background:var(--blue);color:#fff;border:0;border-radius:10px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer;width:100%}
input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;margin:6px 0 12px}
label{font-size:13px;color:var(--mut);display:block;text-align:left}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;margin:6px 0 12px}
.btn.o{background:var(--orange)}.btn.g{background:var(--green)}.btn.w{background:#fff;color:var(--blue);border:1px solid var(--blue)}.btn.auto{width:auto;display:inline-block;text-decoration:none}
.row{display:grid;gap:14px}@media(min-width:820px){.row.two{grid-template-columns:2fr 1fr}}
.list .it{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.list .it:last-child{border:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none}.it b{display:block}.it small{color:var(--mut)}.it a{color:inherit;text-decoration:none}
.tag{display:inline-block;font-size:11px;border-radius:999px;padding:2px 8px;background:#eef3fa;color:var(--blue);margin-right:4px}.tag.r{background:#fde8e8;color:var(--red)}.tag.g{background:#e3f5ea;color:var(--green)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12px;background:#fff;cursor:pointer}.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.people{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}.person{border:2px solid var(--line);border-radius:12px;padding:8px 12px;cursor:pointer;display:flex;gap:8px;align-items:center;background:#fff}
.person.on{border-color:var(--orange);background:#fff6ee}.av{width:30px;height:30px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:600}
.note{background:#fff8e6;border:1px solid #f1deaa;border-radius:12px;padding:10px 12px;font-size:13px;margin:10px 0}.note.ok{background:#e9f7ee;border-color:#bfe3cc}.note.bad{background:#fde8e8;border-color:#f3c3c3}
.wa{background:#dcf8c6;border-radius:12px;padding:10px 12px;font-size:14px;white-space:pre-line;max-width:440px;margin:8px 0}
.dim{opacity:.55}
</style>
{% block head %}{% endblock %}
</head><body>
{% block body %}{% endblock %}
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", function () { navigator.serviceWorker.register("{% url 'service_worker' %}", { scope: "/" }).catch(function () {}); });
}
</script>
</body></html>
